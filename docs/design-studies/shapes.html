<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speedydoodle shape options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Bangers&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #161616; color: #fff; font-family: "DM Sans", sans-serif; }
  .intro { max-width: 1100px; margin: 0 auto; padding: 32px 24px 8px; color: #bbb; line-height: 1.5; }
  .intro b { color: #fff; }
  .option { max-width: 1100px; margin: 28px auto; background: #222; border: 1px solid #333; border-radius: 14px; overflow: hidden; }
  .tag { display: flex; gap: 14px; align-items: baseline; padding: 14px 24px; background: #0b0b0b; border-bottom: 1px solid #333; font: 500 14px "DM Sans", sans-serif; color: #bbb; }
  .tag strong { color: #fff; font-size: 18px; }
  .stage { padding: 36px 32px 44px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 36px; align-items: start; }
  @media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
  h2 { font-family: Bangers, sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 1.5px; line-height: 1; margin-bottom: 18px; }
  .label { font: 700 12px "DM Sans", sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #8d8d8d; margin-bottom: 12px; }
  .col > * + .label { margin-top: 30px; }
  .btn { display: inline-block; font-family: Bangers, sans-serif; font-size: 22px; letter-spacing: 1.5px; color: #fff; background: #b42401; padding: 12px 26px; text-decoration: none; cursor: pointer; border: 0; }
  .btn.ghost { background: transparent; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .tile { position: relative; height: 210px; background: url(img/parties.png) center / cover; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; overflow: hidden; }
  .tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,.05) 65%); }
  .tile span, .tile b { position: relative; z-index: 1; }
  .tile span { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #ddd; }
  .tile b { font-family: Bangers, sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 1.5px; }
  .quote { line-height: 1.55; color: #e4e4e4; font-size: 15px; }
  .quote cite { display: block; margin-top: 10px; font-style: normal; font-weight: 700; color: #fff; }
  .field { display: block; }
  .field span { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #ddd; }
  .field input { width: 100%; font: 400 16px "DM Sans", sans-serif; color: #fff; background: #161616; padding: 12px 14px; outline: 0; }
  .field + .field { margin-top: 14px; }

  /* A: clean and soft */
  .a .btn { border-radius: 999px; transition: background .15s; }
  .a .btn:hover { background: #cf2c05; }
  .a .btn.ghost { border: 1.5px solid rgba(255,255,255,.5); }
  .a .tile { border-radius: 16px; }
  .a .quote { background: #2c2c2c; padding: 20px 22px; border-radius: 16px; }
  .a .field input { border: 1px solid #555; border-radius: 10px; }
  .a .field input:focus { border-color: #e2491f; }

  /* B: comic panels. Ink outlines, hard shadows, dots, a small tilt. */
  .b .stage { background-image: radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.6px); background-size: 14px 14px; }
  .b .btn { border: 3px solid #fff; box-shadow: 5px 5px 0 #000; transition: transform .1s, box-shadow .1s; }
  .b .btn:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 #000; }
  .b .btn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 #000; }
  .b .btn.ghost { background: #161616; }
  .b .tile { border: 4px solid #fff; box-shadow: 8px 8px 0 #b42401; transform: rotate(-1.5deg); transition: transform .15s; }
  .b .tile:hover { transform: rotate(0deg) scale(1.02); }
  .b .quote { position: relative; background: #fff; color: #111; padding: 18px 20px; border: 3px solid #000; border-radius: 22px; box-shadow: 6px 6px 0 #b42401; }
  .b .quote cite { color: #000; }
  .b .quote::after { content: ""; position: absolute; left: 34px; bottom: -22px; border: 12px solid transparent; border-top-color: #fff; border-left-color: #fff; filter: drop-shadow(3px 3px 0 #000); }
  .b .field input { border: 3px solid #fff; box-shadow: 4px 4px 0 #000; }
  .b .field input:focus { border-color: #e2491f; }

  /* C: ink and shadow on the things you press. Nothing tilted, no pattern. */
  .c .btn { border: 2px solid #fff; box-shadow: 4px 4px 0 #000; transition: transform .1s, box-shadow .1s; }
  .c .btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #000; }
  .c .btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #000; }
  .c .btn.ghost { background: transparent; }
  .c .tile { border: 2px solid #fff; transition: transform .15s, box-shadow .15s; }
  .c .tile:hover { transform: translate(-3px,-3px); box-shadow: 6px 6px 0 #b42401; }
  .c .quote { position: relative; background: #fff; color: #111; padding: 18px 20px; border-radius: 18px; }
  .c .quote cite { color: #000; }
  .c .quote::after { content: ""; position: absolute; left: 34px; bottom: -20px; border: 11px solid transparent; border-top-color: #fff; border-left-color: #fff; }
  .c .field input { border: 2px solid #777; }
  .c .field input:focus { border-color: #fff; box-shadow: 4px 4px 0 #b42401; }
</style>
</head>
<body>
<div class="intro">
  <p><b>Shape options.</b> Each block shows the same five things: buttons, a picture tile, a customer quote, and a form field. Move the pointer over the buttons and the tile, press a button, and click in the field. The fonts are the same in each block. This page is a throwaway study, not the site.</p>
</div>
<template id="slice">
  <div class="stage">
    <div class="col">
      <div class="label">Buttons</div>
      <div class="row"><a class="btn">Get a quote</a><a class="btn ghost">Explore</a></div>
      <div class="label">Form field</div>
      <label class="field"><span>First name</span><input placeholder="Ada"></label>
      <label class="field"><span>Email</span><input placeholder="ada@example.com"></label>
    </div>
    <div class="col">
      <div class="label">Picture tile</div>
      <div class="tile"><span>Party</span><b>Caricatures</b></div>
    </div>
    <div class="col">
      <div class="label">Customer quote</div>
      <p class="quote">"Mike was amazing and everyone really enjoyed his talent. He engages with everyone and makes it a memorable experience."<cite>Christine R.</cite></p>
    </div>
  </div>
</template>
<script>
  const options = [
    ['a', 'A', 'Clean and soft: round corners, thin lines, no shadows'],
    ['b', 'B', 'Comic panels: ink outlines, hard shadows, a dot pattern, tilted tiles, speech bubbles'],
    ['c', 'C', 'Ink and shadow: outlines and hard shadows on the things you press, a plain speech bubble, nothing tilted'],
  ];
  for (const [cls, letter, label] of options) {
    const section = document.createElement('section');
    section.className = 'option ' + cls;
    section.innerHTML = '<div class="tag"><strong>' + letter + '</strong><span>' + label + '</span></div>';
    section.appendChild(document.getElementById('slice').content.cloneNode(true));
    document.body.appendChild(section);
  }
</script>
</body>
</html>
